name: Validation

on:
  push:
  pull_request:

jobs:
  javascript-syntax:
    name: Vérifier la syntaxe JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vérifier les fichiers JavaScript
        shell: bash
        run: find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
